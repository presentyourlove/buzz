# Daily Evolution Workflow
# This workflow runs daily at 22:30 Asia/Taipei to generate optimization proposals
# based on the day's channel conversations and work logs.
#
# DEPLOYMENT NOTE:
# This workflow uses `call_webhook` to trigger an external endpoint that runs
# the daily_evolution.py script. For local deployment without a webhook server,
# use the cron wrapper script instead (see daily-evolution-trigger.sh).
#
# To deploy this workflow (requires webhook endpoint):
# 1. Deploy a webhook server that accepts POST at /daily-evolution
#    The server should run: bash scripts/daily-evolution-trigger.sh
# 2. Set required environment variables (BUZZ_RELAY_URL, BUZZ_PRIVATE_KEY, BUZZ_AUTH_TAG)
# 3. Run: buzz workflows create --channel <CHANNEL_UUID> --yaml daily_evolution_workflow.yaml
#
# For local cron-based deployment (recommended):
#   30 22 * * * TZ=Asia/Taipei /path/to/buzz/scripts/daily-evolution-trigger.sh \
#       >> /path/to/buzz/WORK_LOGS/daily_evolution_$(date +\%Y\%m\%d).log 2>&1
#
# The workflow uses a schedule trigger with cron expression for 22:30 daily (Asia/Taipei).
# It calls a webhook to execute the trigger script and posts the summary to the channel.

name: "Daily Evolution Proposal Generator"
description: "Runs daily at 22:30 Asia/Taipei to analyze conversations and generate optimization proposals for boss approval"
trigger:
  on: schedule
  cron: "30 22 * * *"  # 22:30 Asia/Taipei daily
  timezone: "Asia/Taipei"
enabled: true

steps:
  - id: run_evolution_script
    name: "Run Daily Evolution Trigger"
    action: call_webhook
    url: "https://your-webhook.example.com/daily-evolution"  # REPLACE with actual webhook URL
    method: "POST"
    headers:
      Content-Type: "application/json"
      Authorization: "Bearer {{secrets.WEBHOOK_TOKEN}}"  # Optional: add auth token
    body: |
      {
        "channel_id": "{{workflow.channel_id}}",
        "workspace_root": "{{workflow.workspace_root}}",
        "date": "{{trigger.timestamp}}",
        "script": "daily-evolution-trigger.sh"
      }
    timeout_secs: 300

  - id: post_summary
    name: "Post Proposal Summary to Channel"
    if: "steps_run_evolution_script_output_success == true"
    action: send_message
    text: |
      {{steps_run_evolution_script_output_summary}}
    channel: "{{workflow.channel_id}}"
    reply_in_thread: false

  - id: post_error
    name: "Post Error Notification"
    if: "steps_run_evolution_script_output_success != true"
    action: send_message
    text: |
      ## ❌ Daily Evolution Failed - {{trigger.timestamp}}

      The daily evolution trigger encountered an error:

      ```
      {{steps_run_evolution_script_output_error}}
      ```

      Please check the logs and try running manually:
      `bash scripts/daily-evolution-trigger.sh`
    channel: "{{workflow.channel_id}}"
    reply_in_thread: false
