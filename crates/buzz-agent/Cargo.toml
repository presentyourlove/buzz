[package]
name = "buzz-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Minimal, unbreakable ACP-compliant agent. Non-streaming. Tool-calls-as-output."
readme = "README.md"
keywords = ["acp", "agent", "llm", "mcp", "minimal"]
categories = ["command-line-utilities", "web-programming"]

[lints.rust]
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"
unused_mut = "allow"
unused_assignments = "allow"

[lib]
name = "buzz_agent"
path = "src/lib.rs"

[[bin]]
name = "buzz-agent"
path = "src/main.rs"

[[bin]]
name = "publish-agents"
path = "src/bin/publish_agents.rs"

# Test-only fake MCP server. Built unconditionally because cargo can't gate
# bins on `cfg(test)`, but it's tiny and only used by integration tests.
[[bin]]
name = "fake-mcp"
path = "tests/bin/fake_mcp.rs"

# Test-only lock holder: a real second process that takes the coordinator's
# cross-process advisory lock, so the auth tests can prove genuine
# inter-process single-flight and crash-release rather than same-process
# handles. Tiny; only used by the databricks auth integration tests.
[[bin]]
name = "lock-holder"
path = "tests/bin/lock_holder.rs"

# Test-only auth worker: a real second process that runs the PUBLIC auth
# coordinator API (`acquire_with_intent`) with a scripted browser opener and a
# shared temp cache, so the auth tests can prove the cross-process single-flight
# contract end-to-end — durable cooldown sharing and one-grant/one-cache races
# across a genuine process boundary, not two in-process handles. Only used by
# the databricks auth integration tests.
[[bin]]
name = "auth-worker"
path = "tests/bin/auth_worker.rs"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "process", "time", "net"] }
tokio-tungstenite = { workspace = true }
redis = { workspace = true }
deadpool-redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
reqwest = { workspace = true, features = ["json", "native-tls", "form"] }
rmcp = { version = "1", default-features = false, features = ["client", "transport-child-process"] }
arc-swap = "1"
getrandom = "0.4"
tracing = { workspace = true }

# Browser Automation (Playwright)
playwright-rs = { workspace = true }
tracing-subscriber = { workspace = true }
# OAuth 2.0 PKCE for Databricks (and future browser-auth providers).
async-trait = "0.1"
axum = { workspace = true }
base64 = "0.22"
hex = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
urlencoding = "2"
webbrowser = "1"
dirs = "6"
uuid = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
# Crossbeam channels for EventBus
crossbeam-channel = "0.5"
# System Health Guardian: process/port scanning, system info
sysinfo = "0.32"

# Cron scheduling for Phase B health guardian
cron = { workspace = true }

# TOML config support for Phase C
toml = "0.8"

# Cross-process advisory file lock (flock on Unix, LockFileEx on Windows) for
# the auth coordinator's single-flight. Kept off std's `File::try_lock` so the
# crate stays buildable on the repo's declared 1.88 MSRV (those std APIs are
# 1.89+).
fs2 = "0.4"

# Mode B: HistoryItem memory cache (DashMap + blake3)
dashmap = "6"
blake3 = "1"

# Nostr protocol support for Health Guardian alerts
nostr = { workspace = true }

# 階段 E：跨進程持久化 Checkpoint 之 AES-256-GCM 靜態認證加密（使用工作區快取既有關聯版本以支援離線編譯）
aes-gcm = "0.10.3"

# Browser automation skills (Phase 2)
browser-automation = { path = "../../skills/browser-automation" }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }

[dev-dependencies]
# Synthetic TLS OAuth/catalog servers exercise the strict HTTPS production path.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros", "io-std", "io-util", "sync", "process", "time", "net"] }
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }
axum = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
