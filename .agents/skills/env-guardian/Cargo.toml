[package]
name = "env-guardian-skill"
version = "1.0.0"
edition = "2021"
authors = ["Honey2"]
description = "执行前环境变量与依赖缺失健检，预防执行期错误，提升系统稳健度的 Rust 内建技能"
license = "Apache-2.0"
repository = "https://github.com/block/sprout"

[dependencies]
# Buzz Agent 核心依赖
buzz-agent = { path = "../../../crates/buzz-agent" }
buzz-core = { path = "../../../crates/buzz-core" }

# Rust 标准依赖
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "env_guardian"
crate-type = ["cdylib", "rlib"]

[features]
default = []

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
