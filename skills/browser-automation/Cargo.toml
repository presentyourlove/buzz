[package]
name = "browser-automation"
version = "0.1.0"
edition = "2021"
description = "瀏覽器自動化技能 - 基於 Playwright Rust，提供安全的 Web 互動、GUI 操作與憑證隔離能力"

[lints.rust]
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"

[dependencies]
playwright = { package = "playwright-rs", version = "0.21", features = ["default"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
tracing = "0.1"
url = "2.0"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }



[dev-dependencies]
tempfile = "3.0"
